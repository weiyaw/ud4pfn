[project]
name = "ud4pfn"
version = "0.1.0"
description = "Reproducibility code for uncertainty decomposition with Bayes-filtered transformers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hydra-core",
    "jax[cuda12]; sys_platform == 'linux'",
    "jax; sys_platform != 'linux'",
    "jaxtyping",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "tabpfn==6.2.0",
    "tabulate",
    "torch==2.9.0",
    "tqdm",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
