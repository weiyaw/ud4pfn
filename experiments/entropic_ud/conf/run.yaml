defaults:
  - _self_

setup: logistic-linear
data_size: 75
x_grid_size: 100
x_design: "gaussian:1.5:3.0"
shuffle_data: true
fix_data: true
seed: 1000
n_estimators: 64
mc_samples: 1000
id: entropic-ud
lastrun: ${now:%Y-%m-%dT%H:%M:%S%z}
git: ${githash:}

hydra:
  run:
    dir: "./outputs/${id}/setup=${setup} x_design=${x_design} shuffle=${shuffle_data} n_est=${n_estimators} n=${data_size} m=${x_grid_size} seed=${seed}"
  sweep:
    dir: ${hydra.run.dir}
    subdir: .
